# Render Blueprint: API + MongoDB in one Docker service (no Atlas required)
services:
  - type: web
    name: online-food-ordering-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: 'true'
      - key: MONGODB_URI
        value: mongodb://127.0.0.1:27017/food-ordering
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CLIENT_URL
        value: https://online-food-ordering-system-client.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        value: ''
      - key: CLOUDINARY_API_KEY
        value: ''
      - key: CLOUDINARY_API_SECRET
        value: ''
